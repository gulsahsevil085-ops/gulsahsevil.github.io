<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gülşah Sevil - Sosyal Hizmet Öğrencisi - Özgeçmiş">
  <title>Gülşah Sevil | Özgeçmiş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --lacivert: #1f3a5f;
      --vurgu: #2a8c92;
      --zemin: #f3f5f8;
      --kutu: #ffffff;
      --yazi: #2b2f36;
      --gri: #667085;
      --cizgi: #dfe4ea;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Source Sans 3', Arial, sans-serif;
      background: var(--zemin);
      color: var(--yazi);
      line-height: 1.7;
      font-size: 16px;
    }

    /* Üst bölüm */
    header {
      background: var(--lacivert);
      color: white;
      padding: 56px 20px 52px;
      border-bottom: 5px solid var(--vurgu);
    }
    .ust-icerik { max-width: 960px; margin: 0 auto; }
    header h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    header .unvan {
      margin: 6px 0 0;
      font-size: 19px;
      font-weight: 500;
      opacity: 0.95;
    }
    header .okul {
      margin: 2px 0 0;
      font-size: 16px;
      opacity: 0.8;
    }

    /* İki sütun yapısı */
    .sayfa {
      max-width: 960px;
      margin: 32px auto 40px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 28px;
      align-items: start;
    }
    aside, main section, aside section {
      background: var(--kutu);
      border: 1px solid var(--cizgi);
      border-radius: 8px;
    }
    aside section { padding: 24px; margin-bottom: 20px; }
    main section { padding: 28px 32px; margin-bottom: 20px; }
    aside section:last-child, main section:last-child { margin-bottom: 0; }
    aside { background: none; border: none; }

    h2 {
      margin: 0 0 16px;
      padding-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--lacivert);
      border-bottom: 2px solid var(--vurgu);
    }
    p { margin: 0; }

    /* Liste öğeleri */
    .oge { margin-bottom: 14px; }
    .oge:last-child { margin-bottom: 0; }
    .oge .baslik { font-weight: 600; color: var(--yazi); }
    .oge .alt { color: var(--gri); font-size: 15px; }
    .oge .tarih {
      color: var(--vurgu);
      font-size: 14px;
      font-weight: 600;
    }

    /* Eğitim ve kurslar */
    .kayit {
      padding-left: 16px;
      border-left: 3px solid var(--vurgu);
      margin-bottom: 18px;
    }
    .kayit:last-child { margin-bottom: 0; }
    .kayit h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--lacivert);
    }
    .kayit .alt { color: var(--gri); font-size: 15px; }
    .kayit .tarih {
      color: var(--vurgu);
      font-size: 14px;
      font-weight: 600;
    }

    /* Bağlantı */
    .baglanti {
      color: var(--lacivert);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 2px solid var(--vurgu);
    }
    .baglanti:hover { color: var(--vurgu); }

    footer {
      text-align: center;
      color: var(--gri);
      font-size: 13px;
      padding: 0 20px 36px;
    }
